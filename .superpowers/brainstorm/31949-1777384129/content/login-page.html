<h2>模拟登录页</h2>
<p class="subtitle">未登录点击「发起调试」时跳转到此页面</p>

<div class="mockup">
  <div class="mockup-header">登录页 — /login</div>
  <div class="mockup-body" style="padding: 0; height: 400px; display: flex; flex-direction: column; font-size: 11px;">
    <!-- Nav bar (simplified) -->
    <div style="height: 48px; background: #1a1a2e; display: flex; align-items: center; padding: 0 16px; gap: 24px; flex-shrink: 0;">
      <span style="color: #fff; font-weight: 600; font-size: 14px;">SenseCore</span>
      <span style="flex: 1;"></span>
    </div>

    <!-- Login form centered -->
    <div style="flex: 1; background: #f1f5f9; display: flex; align-items: center; justify-content: center;">
      <div style="background: #fff; border-radius: 12px; padding: 32px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); width: 340px;">
        <div style="text-align: center; margin-bottom: 24px;">
          <div style="font-size: 18px; font-weight: 700; color: #1e293b;">登录 SenseCore</div>
          <div style="font-size: 11px; color: #94a3b8; margin-top: 6px;">登录后即可使用 API 在线调试功能</div>
        </div>

        <div style="margin-bottom: 14px;">
          <label style="font-size: 11px; color: #475569; display: block; margin-bottom: 4px;">用户名 / 邮箱</label>
          <input style="width: 100%; padding: 8px 12px; border: 1px solid #e2e8f0; border-radius: 6px; font-size: 12px;" placeholder="输入任意内容">
        </div>

        <div style="margin-bottom: 20px;">
          <label style="font-size: 11px; color: #475569; display: block; margin-bottom: 4px;">密码</label>
          <input type="password" style="width: 100%; padding: 8px 12px; border: 1px solid #e2e8f0; border-radius: 6px; font-size: 12px;" placeholder="输入任意内容">
        </div>

        <button style="width: 100%; padding: 10px; background: #4361ee; color: #fff; border: none; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer;">登 录</button>

        <div style="text-align: center; margin-top: 12px; font-size: 10px; color: #94a3b8;">
          Demo 模式：输入任意内容即可登录
        </div>
      </div>
    </div>
  </div>
</div>

<p style="margin-top: 16px; font-size: 13px; color: #64748b; line-height: 1.6;">
  <strong>交互流程：</strong><br>
  &bull; 默认未登录状态 — 浏览产品列表和文档不受限<br>
  &bull; 点击「发起调试」→ 跳转 <code>/login</code>，提示需登录<br>
  &bull; 输入任意内容点击登录 → 设置 localStorage 登录态 → 自动跳回之前的调试页<br>
  &bull; 登录后「发起调试」正常执行（展示 mock 响应）<br>
  &bull; 导航栏右侧用户区域反映登录/未登录状态
</p>
